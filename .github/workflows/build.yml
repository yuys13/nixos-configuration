name: Build NixOS and Home Manager
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: yuys13
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community
      - name: Flake check
        run: nix flake check --no-build --all-systems --keep-going
      - name: Build NixOS configuration
        run: nix build --keep-going --no-link --show-trace --eval-system x86_64-linux --print-out-paths .#nixosConfigurations.hyper-nixos.config.system.build.toplevel
      - name: Build Home Manager configuration
        run: nix build --keep-going --no-link --show-trace --eval-system x86_64-linux --print-out-paths .#homeConfigurations."yuys13".activationPackage
