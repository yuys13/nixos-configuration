name: Build NixOS and Home Manager
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: yuys13
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community
      - name: Flake check
        run: nix flake check --no-build --all-systems --keep-going
      - name: Build NixOS configuration
        run: nix build --keep-going --no-link --show-trace --eval-system x86_64-linux --print-out-paths .#nixosConfigurations.hyper-nixos.config.system.build.toplevel
      - name: Build Home Manager configuration
        run: nix build --keep-going --no-link --show-trace --eval-system x86_64-linux --print-out-paths .#homeConfigurations."yuys13".activationPackage
